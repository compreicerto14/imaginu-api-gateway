name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: imaginu-96036
  REGION: us-east1

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Provisiona infraestrutura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: auth
        name: Autentica no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/940298061308/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@imaginu-96036.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Habilita APIs necessárias
        run: |
          gcloud services enable \
            servicemanagement.googleapis.com \
            servicecontrol.googleapis.com \
            endpoints.googleapis.com \
            run.googleapis.com \
            --project=${{ env.PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -var="project_id=${{ env.PROJECT_ID }}" -var="region=${{ env.REGION }}"
